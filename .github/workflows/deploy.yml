name: Build and Commit Output

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the project (vite build, sitemap, then prerendering)
        run: npm run build
        env:
          # Address of the Talk now call server (set it under Settings >
          # Secrets and variables > Actions > Variables). Empty is fine:
          # the /call page then shows that calls aren't open yet.
          VITE_CALL_SERVER_URL: ${{ vars.VITE_CALL_SERVER_URL }}

      - name: Copy the finished build into deploy-output
        run: |
          rm -rf deploy-output
          mkdir -p deploy-output
          cp -r dist/. deploy-output/

      - name: Commit and push the finished build
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deploy-output [skip ci]"
          file_pattern: deploy-output/**

name: Build and Commit Output

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the project (vite build, sitemap, then prerendering)
        run: npm run build
        env:
          # Talk now (set under Settings > Secrets and variables > Actions >
          # Variables). VITE_BOOKING_URL is the Google Apps Script web app
          # address; while it's empty, /call shows "Booking opens soon."
          # VITE_ICE_SERVERS is optional (a TURN relay, as JSON).
          VITE_BOOKING_URL: ${{ vars.VITE_BOOKING_URL }}
          VITE_ICE_SERVERS: ${{ vars.VITE_ICE_SERVERS }}

      - name: Copy the finished build into deploy-output
        run: |
          rm -rf deploy-output
          mkdir -p deploy-output
          cp -r dist/. deploy-output/

      - name: Commit and push the finished build
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deploy-output [skip ci]"
          file_pattern: deploy-output/**

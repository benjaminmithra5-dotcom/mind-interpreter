# Render Blueprint for the Talk now call server (the website itself stays on
# Vercel). Secrets marked "sync: false" are typed into Render's dashboard and
# never stored here. See call-server/README.md.
services:
  - type: web
    name: mind-interpreter-calls
    runtime: docker
    rootDir: call-server
    dockerfilePath: ./Dockerfile
    # Calls need an instance that is always on (the free type sleeps when
    # idle). Check current pricing on render.com before choosing.
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://benjaminmithra.com,https://www.benjaminmithra.com
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ICE_SERVERS
        sync: false
